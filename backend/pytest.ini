[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Timeouts ──────────────────────────────────────────────────────────────────
# Kill any test that runs longer than 30 seconds.
# Prevents a single hanging WebSocket or stuck mock from blocking the suite.
# Override per-test with @pytest.mark.timeout(N) when a test is legitimately slow.
timeout = 30

# ── Strictness ────────────────────────────────────────────────────────────────
# Fail on unknown marks (prevents silent typos in @pytest.mark.X decorators).
# Fail on unraisable exceptions from background threads or async teardown.
addopts = --strict-markers

# ── Logging ───────────────────────────────────────────────────────────────────
# Capture structured log output during test runs so security tests can assert
# that secrets never appear in log records.
log_cli = false
log_level = DEBUG
log_format = %(asctime)s  %(levelname)-8s  %(name)s  %(message)s
log_date_format = %H:%M:%S

# ── Registered markers ────────────────────────────────────────────────────────
# Every @pytest.mark.X used in any test file must be declared here.
# Undeclared marks are rejected by --strict-markers, preventing silent test
# misclassification from typos.
markers =
    unit: Fast, isolated unit tests with no I/O (no DB, no Redis, no network).
    integration: Tests that require a running infrastructure stack.
    security: Tests that verify authentication, authorisation, injection protection,
              secret handling, and data isolation.
    property: Hypothesis-based property tests (may run many examples; slightly slower).
    slow: Tests that are intentionally slow (e.g. real LLM calls, large embeddings).
          Excluded by default in CI fast runs: -m "not slow".
    mcp: Tests specific to the MCP tool layer.
    agent: Tests specific to the agent orchestration layer.
    rag: Tests specific to the RAG retrieval pipeline.
    auth: Tests specific to authentication and JWT handling.
    authz: Tests specific to authorisation, RBAC, and access control.
    timeout: Tests that verify execution timeout enforcement.
    mcp_timeout: Tests specific to MCP tool timeout enforcement.
    injection: Tests that verify prompt injection detection and blocking.
    isolation: Tests that verify per-user data isolation and cross-user protection.
    observability: Tests that verify structured logging and metric emission.
