# Ruff configuration for the Android AI Assistant backend.
# https://docs.astral.sh/ruff/configuration/

line-length = 100
target-version = "py311"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "I",      # isort
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "N",      # pep8-naming
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific rules
]

ignore = [
    # ── Annotation rules — too noisy for existing codebase, add incrementally ──
    "ANN001",  # Missing type annotation for function argument
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "ANN205",  # Missing return type annotation for staticmethod
    "ANN206",  # Missing return type annotation for classmethod

    # ── Unicode ambiguous character rules — used intentionally in docs/strings ──
    "RUF001",  # String contains ambiguous unicode character (en-dash, ×, etc.)
    "RUF002",  # Docstring contains ambiguous unicode character
    "RUF003",  # Comment contains ambiguous unicode character

    # ── Naming — validator functions in Pydantic use uppercase convention ──
    "N802",    # Function name should be lowercase (Pydantic validators)
    "N806",    # Variable in function should be lowercase

    # ── Exception chaining — large existing codebase, fix incrementally ──
    "B904",    # raise without `from` inside except clause

    # ── try/except/pass — used intentionally in background tasks ──
    "S110",    # try-except-pass detected

    # ── S101 — assert is the standard pytest assertion mechanism.
    #    Globally ignored because per-file-ignores glob matching is unreliable
    #    across ruff versions. Bandit runs separately in security-scan.yml for
    #    production code path analysis.
    "S101",

    # ── S105 / S106 — test fixtures use intentional hardcoded credential strings ──
    "S105",    # Possible hardcoded password assigned to variable
    "S106",    # Possible hardcoded password in function argument

    # ── UP041 — asyncio.TimeoutError alias is fine in Python 3.11 ──
    "UP041",

    # ── RUF012 — ClassVar annotation not required for Pydantic/pytest patterns ──
    "RUF012",

    # ── B017 — pytest.raises(Exception) is used in websocket tests intentionally ──
    "B017",
]

# Allow unused noqa directives to be flagged only when the rule is actually enabled
# (prevents RUF100 from firing on noqa for rules we've disabled above)
unfixable = []

[lint.per-file-ignores]
# Alembic migrations — module-level imports after env setup is intentional (E402),
# older typing patterns (UP), and long column definitions (E501) are expected.
"alembic/**" = ["E402", "E501", "UP035", "UP007", "I001"]

# Test files — assert is pytest idiom (S101), env-setup imports before app imports
# are intentional (E402), hardcoded test credentials are expected (S105, S106),
# long data strings (E501), unused fixture vars (F841), datetime patterns (UP017).
# Both glob forms used for ruff version compatibility.
"tests/**" = ["S101", "S105", "S106", "E402", "E501", "F841", "UP017", "B905", "UP038", "C401"]
"tests/**/*.py" = ["S101", "S105", "S106", "E402", "E501", "F841", "UP017", "B905", "UP038", "C401"]

# Workers — deferred imports inside task functions are intentional (E402),
# noqa for PLC0415 (pylint import-outside-toplevel) is used for Celery pattern.
"app/workers/**" = ["E402", "E501", "I001"]

# Settings — validator method names use SCREAMING_SNAKE_CASE by convention.
"app/config/settings.py" = ["N802", "E501"]

[lint.isort]
known-first-party = ["app"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
