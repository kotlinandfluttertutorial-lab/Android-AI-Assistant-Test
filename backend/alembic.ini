# alembic.ini — Alembic migration tool configuration for Android AI Assistant backend.
#
# Run migrations with:
#   alembic upgrade head          # apply all pending migrations
#   alembic downgrade -1          # revert the most recent migration
#   alembic revision --autogenerate -m "description"   # generate a new migration
#
# The DATABASE_URL is read from the environment variable at runtime via env.py;
# the sqlalchemy.url key here is a placeholder that env.py overrides.
#
# Requirements: 9.3, 9.10

[alembic]
# Path to the directory containing env.py and the versions/ sub-directory.
script_location = alembic

# Template used when generating new migration scripts.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for generated file names (UTC keeps timestamps unambiguous).
timezone = UTC

# Maximum length of the auto-generated slug (description fragment) in the filename.
truncate_slug_length = 40

# The URL is overridden at runtime by env.py which reads settings.DATABASE_URL.
# Do NOT put real credentials here — this file is committed to source control.
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost/placeholder

# Location of the migration version scripts.
# Alembic resolves this relative to the script_location directory (alembic/).
# The default is %(script_location)s/versions — no override needed.
# version_locations = %(script_location)s/versions

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
