name: ai_assistant_flutter
description: Flutter client for the Android AI Assistant — consumes the FastAPI backend.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Networking ────────────────────────────────────────────────────
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1

  # ── Serialisation ─────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Secure storage ────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Preferences (non-sensitive) ───────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Markdown rendering ────────────────────────────────────────────
  flutter_markdown: ^0.7.3+1

  # ── Utilities ─────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Code generation ───────────────────────────────────────────────
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

  # ── Linting ───────────────────────────────────────────────────────
  flutter_lints: ^4.0.0

  # ── Test utilities ────────────────────────────────────────────────
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
