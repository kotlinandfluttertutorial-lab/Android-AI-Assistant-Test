<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-hidden">
<!-- Top App Bar (Suppressing shared nav for focus) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dark flex justify-between items-center h-16 px-margin-mobile w-full z-40">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary dark:text-primary-fixed-dim">AI Listening</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center relative px-margin-mobile">
<!-- Background Animation Overlay -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
</div>
<!-- Central Microphone & Pulse Area -->
<div class="relative z-10 flex flex-col items-center">
<!-- Pulse Rings -->
<div class="absolute w-48 h-48 rounded-full bg-primary/20 pulse-layer"></div>
<div class="absolute w-48 h-48 rounded-full bg-primary/10 pulse-layer-2"></div>
<div class="absolute w-48 h-48 rounded-full bg-primary/5 pulse-layer-3"></div>
<!-- Microphone Button -->
<div class="w-32 h-32 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg relative z-20 active:scale-90 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<p class="mt-12 font-title-lg text-title-lg text-primary text-center animate-pulse">
                Listening...
            </p>
</div>
<!-- Transcript Text Display -->
<section class="mt-12 max-w-md w-full z-10">
<div class="bg-surface-container-low/80 glass-blur rounded-[24px] p-6 min-h-[120px] shadow-sm border border-outline/10">
<p class="font-body-lg text-body-lg text-on-surface leading-relaxed transition-all duration-300" id="transcript">
                    "I'm looking for a quick recipe for dinner tonight using chicken and spinach, something that takes less than thirty minutes..."
                </p>
<div class="inline-block w-2 h-6 bg-primary ml-1 align-middle animate-pulse" id="cursor"></div>
</div>
</section>
<!-- Sound Wave Visualization -->
<div class="mt-auto mb-12 w-full max-w-lg h-16 flex items-end justify-center gap-1 z-10" id="wave-container">
<!-- Generated by JS -->
</div>
</main>
<!-- Controls Footer -->
<footer class="p-8 flex items-center justify-center gap-8 z-20">
<button class="flex flex-col items-center gap-2 text-on-surface-variant hover:text-error transition-colors group">
<div class="w-14 h-14 rounded-full border border-outline/30 flex items-center justify-center group-hover:bg-error-container group-hover:border-error/20 active:scale-95 duration-100">
<span class="material-symbols-outlined">cancel</span>
</div>
<span class="font-label-md text-label-md">Cancel</span>
</button>
<button class="flex flex-col items-center gap-2 text-on-surface-variant hover:text-primary transition-colors group">
<div class="w-20 h-20 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container shadow-sm active:scale-95 duration-200">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">stop</span>
</div>
<span class="font-label-lg text-label-lg font-bold">Stop</span>
</button>
<button class="flex flex-col items-center gap-2 text-on-surface-variant hover:text-primary transition-colors group">
<div class="w-14 h-14 rounded-full border border-outline/30 flex items-center justify-center group-hover:bg-primary-container group-hover:border-primary/20 active:scale-95 duration-100">
<span class="material-symbols-outlined">keyboard</span>
</div>
<span class="font-label-md text-label-md">Type</span>
</button>
</footer>
<script>
        // Generate Sound Wave Bars
        const waveContainer = document.getElementById('wave-container');
        const barCount = 40;
        const bars = [];

        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar w-1.5 bg-primary/40 rounded-full';
            bar.style.height = '10%';
            waveContainer.appendChild(bar);
            bars.push(bar);
        }

        // Simulate Animation of Sound Wave
        function animateWave() {
            bars.forEach((bar, index) => {
                // Create a wave pattern with some randomness
                const frequency = Date.now() / 200;
                const baseHeight = Math.sin(frequency + (index * 0.2)) * 30 + 40;
                const randomOffset = Math.random() * 20;
                const finalHeight = Math.max(10, baseHeight + randomOffset);
                bar.style.height = `${finalHeight}%`;
                
                // Color shift based on height
                if (finalHeight > 60) {
                    bar.style.backgroundColor = 'var(--primary)';
                    bar.style.opacity = '0.9';
                } else {
                    bar.style.backgroundColor = '#6750a4'; // Using primary hex as fallback
                    bar.style.opacity = '0.4';
                }
            });
            requestAnimationFrame(animateWave);
        }

        animateWave();

        // Simulate Dynamic Transcript
        const transcriptEl = document.getElementById('transcript');
        const phrases = [
            "I'm looking for a quick recipe...",
            "Something with chicken and spinach...",
            "Under thirty minutes total...",
            "Maybe a healthy pasta dish?",
            "Can you suggest some ingredients?"
        ];
        let currentPhraseIndex = 0;
        let charIndex = 0;

        function typeTranscript() {
            const currentText = phrases[currentPhraseIndex];
            if (charIndex < currentText.length) {
                transcriptEl.textContent = `"${currentText.substring(0, charIndex + 1)}"`;
                charIndex++;
                setTimeout(typeTranscript, 50 + Math.random() * 50);
            } else {
                setTimeout(() => {
                    charIndex = 0;
                    currentPhraseIndex = (currentPhraseIndex + 1) % phrases.length;
                    typeTranscript();
                }, 2000);
            }
        }

        typeTranscript();
    </script>
