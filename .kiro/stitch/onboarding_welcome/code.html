<style>

<!-- Background Micro-interactions (Particles) -->
<script>
        // Simple particle effect for extra "Premium" feel
        const createParticle = () => {
            const particle = document.createElement('div');
            const size = Math.random() * 4 + 2;
            const x = Math.random() * window.innerWidth;
            const duration = Math.random() * 10 + 10;
            
            particle.className = 'fixed bg-primary/10 rounded-full pointer-events-none z-[-1]';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${x}px`;
            particle.style.bottom = '-10px';
            particle.style.opacity = '0';
            
            document.body.appendChild(particle);
            
            const animation = particle.animate([
                { transform: 'translateY(0) scale(1)', opacity: 0 },
                { transform: `translateY(-${window.innerHeight + 100}px) scale(1.5)`, opacity: 0.5, offset: 0.5 },
                { transform: `translateY(-${window.innerHeight + 200}px) scale(0)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                easing: 'linear'
            });
            
            animation.onfinish = () => particle.remove();
        };

        setInterval(createParticle, 2000);

        // Interactive "Next" logic placeholder
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            // Animating content out before transition (mock)
            const content = document.querySelector('.reveal-up');
            content.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            content.style.opacity = '0';
            content.style.transform = 'translateX(-20px)';
            
            setTimeout(() => {
                alert('Transitioning to slide 2...');
                // Reset for demo purposes
                content.style.opacity = '1';
                content.style.transform = 'translateX(0)';
            }, 600);
        });
    </script>
