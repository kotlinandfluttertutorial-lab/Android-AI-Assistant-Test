<script>
        // Micro-interactions and effects
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.parentElement.classList.add('scale-[1.01]');
                    input.parentElement.parentElement.style.transition = 'transform 0.2s ease-out';
                });
                
                input.addEventListener('blur', () => {
                    input.parentElement.parentElement.classList.remove('scale-[1.01]');
                });
            });
        });

        // Toggle Password Visibility
        const togglePass = document.querySelector('button span[data-icon="visibility"]');
        if (togglePass) {
            let visible = false;
            togglePass.parentElement.addEventListener('click', () => {
                const passInput = document.getElementById('password');
                visible = !visible;
                passInput.type = visible ? 'text' : 'password';
                togglePass.textContent = visible ? 'visibility_off' : 'visibility';
            });
        }
    </script>
<style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-fade-in {
            animation: fade-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
