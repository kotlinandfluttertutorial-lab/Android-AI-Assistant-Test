<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }

        @keyframes logo-float {
            0%, 100% { transform: translateY(0px); }

        }

        .animate-pulse-soft {
            animation: pulse-soft 2s ease-in-out infinite;
        }

        .animate-logo-float {
            animation: logo-float 4s ease-in-out infinite;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Loading dot bar animation */
        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            animation: dot-jump 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dot-jump {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        // Micro-interaction for logo hover/tap
        const logo = document.querySelector('.animate-logo-float').parentElement;
        logo.addEventListener('mousedown', () => {
            logo.style.transform = 'scale(0.95)';
            logo.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
        });
        logo.addEventListener('mouseup', () => {
            logo.style.transform = 'scale(1)';
        });
