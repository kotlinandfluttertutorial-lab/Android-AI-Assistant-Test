# ============================================================================
# Android AI Assistant — Local Development Docker Compose
# ============================================================================
#
# Purpose:
#   Full local backend stack for Android "local" flavor development and
#   integration testing. Mirrors the production topology in docker-compose.prod.yml
#   but is tuned for developer ergonomics (hot-reload, relaxed security, local
#   monitoring, no TLS).
#
# Android Emulator connectivity:
#   The Android Emulator maps 10.0.2.2 → your host machine, so the app reaches
#   Nginx (port 8080) via http://10.0.2.2:8080/ and ws://10.0.2.2:8080/ws/.
#   Nginx proxies all /api/* and /* traffic to FastAPI (port 8000).
#   Nginx proxies /ws/* traffic to FastAPI WebSocket handlers.
#
# Physical device connectivity:
#   Replace 10.0.2.2 with your machine's LAN IP in the Android "local" flavor.
#   Nginx must be reachable on the same LAN. Ensure your firewall allows port 8080.
#   The backend Docker containers bind to 0.0.0.0 so they accept LAN connections.
#   See docs/environments.md §Android — Physical Device for details.
#
# Port map (host → container):
#   8080 → Nginx (local gateway — use this from Android)
#   8000 → FastAPI (direct access for API testing tools)
#   5432 → PostgreSQL
#   6379 → Redis
#   8001 → ChromaDB
#   9000 → MinIO S3 API
#   9001 → MinIO Console UI
#   9090 → Prometheus
#   3000 → Grafana
#   3100 → Loki
#
# Usage:
#   Start:    docker compose -f docker-compose.local.yml up -d
#   Status:   docker compose -f docker-compose.local.yml ps
#   Logs:     docker compose -f docker-compose.local.yml logs -f
#   Stop:     docker compose -f docker-compose.local.yml down
#   Clean:    docker compose -f docker-compose.local.yml down -v
#             ⚠ WARNING: `down -v` DELETES all local database and storage volumes.
#
# Environment variables:
#   Copy .env.local.example → .env.local, fill in your values, then run.
#   Never commit .env.local — it contains local secrets.
# ============================================================================

# ---------------------------------------------------------------------------
# Named volumes — all persistent data lives here
# ---------------------------------------------------------------------------
volumes:
  local_postgres_data:
  local_redis_data:
  local_chroma_data:
  local_minio_data:
  local_prometheus_data:
  local_grafana_data:
  local_loki_data:

# ---------------------------------------------------------------------------
# Shared network — all containers communicate by service name (e.g. postgres,
# redis, chromadb). Never use "localhost" inside containers to reach siblings.
# ---------------------------------------------------------------------------
networks:
  local_ai_net:
    driver: bridge

# ===========================================================================
# Services
# ===========================================================================
services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiassistant_local}
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    networks:
      - local_ai_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiassistant} -d ${POSTGRES_DB:-aiassistant_local}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server
    volumes:
      - local_redis_data:/data
    networks:
      - local_ai_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HTTP_PORT=8000
    volumes:
      - local_chroma_data:/chroma/chroma
    networks:
      - local_ai_net
    # Bind to 127.0.0.1 on the host — ChromaDB is accessed by backend/celery
    # via the Docker network (service name "chromadb"), not from the host.
    # CVE-2026-45829: no patch available; restricting to localhost mitigates
    # exposure on multi-user developer machines.
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - local_minio_data:/data
    networks:
      - local_ai_net
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO console UI → http://localhost:9001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Backend ───────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      # Override any localhost-based URLs from .env.local with Docker service names.
      # Containers must reach siblings by service name — not by 127.0.0.1 / localhost.
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-aiassistant}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-aiassistant_local}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
      MINIO_BUCKET_NAME: "${MINIO_BUCKET_NAME:-aiassistant-local}"
      # ChromaDB runs as a separate service in local; use http client mode.
      CHROMA_HOST: "chromadb"
      CHROMA_PORT: "8000"
      CHROMA_SSL: "false"
      STORAGE_BACKEND: "minio"
      ENVIRONMENT: "development"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - local_ai_net
    expose:
      - "8000"
    ports:
      # Expose directly for API testing tools (Postman, curl, httpie).
      # Android apps should go through Nginx on 8080 instead.
      - "8000:8000"
    volumes:
      # Hot-reload: mount source code so changes take effect without rebuild.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: >
      python -m uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/app
        --log-level debug
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-aiassistant}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-aiassistant_local}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
      MINIO_BUCKET_NAME: "${MINIO_BUCKET_NAME:-aiassistant-local}"
      CHROMA_HOST: "chromadb"
      CHROMA_PORT: "8000"
      CHROMA_SSL: "false"
      STORAGE_BACKEND: "minio"
      ENVIRONMENT: "development"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - local_ai_net
    volumes:
      - ./backend/app:/app/app
    command: >
      python -m celery -A app.workers.celery_app worker
        --loglevel=debug
        --pool=solo
        -Q celery,ingestion,notifications,gdpr,alerts

  # ── Nginx gateway ─────────────────────────────────────────────────────────
  # Primary entry-point for the Android "local" flavor.
  # Android Emulator → http://10.0.2.2:8080/ → Nginx → FastAPI
  # Android Emulator → ws://10.0.2.2:8080/ws/ → Nginx → FastAPI WebSocket
  #
  # Port 8080 is used instead of 80 to avoid conflicts with other local
  # services (e.g. a locally running web server).

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    networks:
      - local_ai_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Observability ─────────────────────────────────────────────────────────
  # Local monitoring mirrors the production observability stack so developers
  # can validate metrics, dashboards, and logs before code reaches GCP Stage.

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - local_prometheus_data:/prometheus
    networks:
      - local_ai_net
    ports:
      - "9090:9090"   # http://localhost:9090
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  loki:
    image: grafana/loki:2.9.6
    restart: unless-stopped
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - local_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - local_ai_net
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local_grafana_password}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - local_grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - local_ai_net
    ports:
      - "3000:3000"   # http://localhost:3000 (admin / local_grafana_password)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
