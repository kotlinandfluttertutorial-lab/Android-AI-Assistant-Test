  # ──────────────────────────────────────────────────────────────────────────
  # 10. Slack Notification (on main-branch failure/success)
  # ──────────────────────────────────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs:
      - build-signed-apk
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Notify Slack
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ needs.build-signed-apk.result == 'success' && '✅ Android APK built and distributed via Firebase' || '❌ Android CI pipeline failed on main' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.build-signed-apk.result == 'success' && '🚀 Android CI — Build & Firebase Distribution' || '❌ Android CI — main branch failure' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*APK Build:*\n${{ needs.build-signed-apk.result }}" },
                    { "type": "mrkdwn", "text": "*Firebase Distribution:*\n${{ needs.build-signed-apk.result }}" },
                    { "type": "mrkdwn", "text": "*Firebase Account:*\nkotlinfiroj@gmail.com" },
                    { "type": "mrkdwn", "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Firebase Console" },
                      "url": "https://console.firebase.google.com"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
