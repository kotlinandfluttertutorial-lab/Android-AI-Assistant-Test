# ============================================================================
# Android CI/CD Pipeline — Production Grade
# ============================================================================
#
# Triggers:
#   pull_request  →  targets main or develop branches
#   push          →  main branch only
#   workflow_dispatch  →  manual trigger
#
# PR Required Status Checks (configure as branch-protection rules):
#   • android-ci / validate
#   • android-ci / dependency-lint
#   • android-ci / hilt-ksp-gate
#   • android-ci / hilt-di-gate
#   • android-ci / android-lint
#   • android-ci / android-unit-tests
#   • android-ci / ktlint-detekt
#   • android-ci / jacoco-gate
#   • android-ci / backend-unit-tests
#   • android-ci / backend-integration-tests
#   • android-ci / instrumented-tests
#
# Main-branch Release Jobs:
#   • android-ci / build-signed-apk  — signed APK artifact (merge-to-main)
#
# Secrets required (repository / environment level):
#   KEYSTORE_BASE64            — base64-encoded release keystore (.jks)
#   KEY_ALIAS                  — key alias in the keystore
#   KEY_PASSWORD               — key password
#   STORE_PASSWORD             — keystore store password
#   GOOGLE_SERVICES_JSON       — google-services.json content (base64)
#   FIREBASE_APP_ID            — Firebase App ID
#   FIREBASE_SERVICE_ACCOUNT   — Firebase service account JSON (base64)
#   FIREBASE_TESTER_GROUPS     — comma-separated tester group aliases
#   SLACK_WEBHOOK_URL          — Slack incoming webhook for notifications (optional)
# ============================================================================

name: android-ci

on:
  pull_request:
    branches:
      - main
      - develop
      - Develop_Main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for Firebase App Distribution testers"
        required: false
        default: "New build from main branch — see commit history for changes."

# Cancel in-flight runs for the same PR / branch to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  PYTHON_VERSION: "3.11"
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configureondemand=true
    -Dkotlin.incremental=false

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # VALIDATION GATE — fail fast before spinning up heavier jobs
  # ──────────────────────────────────────────────────────────────────────────
  validate:
    name: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v3

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Dependency-Lint — enforce Clean Architecture dependency rules
  #    Forbidden edges: feature→feature, domain→data/feature, data→feature
  #    (Requirements 19.2)
  # ──────────────────────────────────────────────────────────────────────────
  dependency-lint:
    name: dependency-lint
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make dependency-lint script executable
        run: chmod +x .github/scripts/check-module-deps.sh

      - name: Run module dependency lint
        run: .github/scripts/check-module-deps.sh "$GITHUB_WORKSPACE"

  # ──────────────────────────────────────────────────────────────────────────
  # Hilt DI Gate — enforce Hilt DI completeness across Android modules (KSP)
  # (Requirements 30.1, 30.2, 30.3, 30.4)
  # ──────────────────────────────────────────────────────────────────────────
  hilt-di-gate:
    name: Hilt DI Binding Verification (KSP)
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          else
            cp app/google-services.json app/google-services.json 2>/dev/null || \
            cat > app/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aiassistant"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.aiassistant.debug"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      - name: Run KSP Hilt code generation (debug)
        run: ./gradlew :app:kspDebugKotlin --stacktrace

      - name: Confirm zero Hilt binding errors
        run: |
          echo "✅ Hilt DI bindings verified — zero binding errors"

  # ──────────────────────────────────────────────────────────────────────────
  # Hilt KSP Gate — confirm zero Hilt binding errors at compile time
  # (Requirements 30.1, 30.2, 30.4)
  # ──────────────────────────────────────────────────────────────────────────
  hilt-ksp-gate:
    name: hilt-ksp-gate
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aiassistant"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.aiassistant.debug"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      - name: Run KSP code generation for Hilt (debug)
        run: ./gradlew :app:kspDebugKotlin --stacktrace

      - name: Confirm zero Hilt binding errors
        run: |
          echo "✅ Hilt KSP code generation completed with zero binding errors"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Android Lint — all modules
  # ──────────────────────────────────────────────────────────────────────────
  android-lint:
    name: android-lint
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aiassistant"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.aiassistant.debug"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      - name: Run Android Lint on all modules
        run: ./gradlew lintDebug --stacktrace --continue

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 7

      - name: Annotate PR with lint issues
        if: failure()
        run: |
          echo "::error::Android Lint failed — see lint-reports artifact for details."
          exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Android Unit Tests — all modules
  #    (Requirements 21.1, 31.1–31.5)
  # ──────────────────────────────────────────────────────────────────────────
  android-unit-tests:
    name: android-unit-tests
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aiassistant"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.aiassistant.debug"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      - name: Run unit tests on all modules
        run: ./gradlew testDebugUnitTest --stacktrace --continue -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" -Porg.gradle.workers.max=2

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Android Unit Test Results
          path: "**/build/test-results/test*/*.xml"
          reporter: java-junit
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}
          list-files: listing

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports-${{ github.run_number }}
          path: "**/build/reports/tests/"
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 4. ktlint + Detekt — block merge on any error in changed Kotlin files
  #    (Requirements 19.5, 19.6)
  #
  #    Strategy:
  #      • Both tools run on the full source tree (required for correct
  #        cross-file rule evaluation in Detekt).
  #      • After each tool run we filter its XML/Checkstyle report to the
  #        set of changed .kt files and emit GitHub "error" annotations only
  #        for those files.  The job fails (exit 1) when any changed file has
  #        at least one violation, blocking the merge.
  #      • The SARIF upload sends full-tree results to GitHub Code Scanning
  #        for historical tracking (informational only, non-blocking).
  # ──────────────────────────────────────────────────────────────────────────
  ktlint-detekt:
    name: ktlint + Detekt
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      security-events: write   # for SARIF upload to GitHub Code Scanning

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aiassistant"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.aiassistant.debug"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      # ── Compute the set of changed .kt files for this PR ──────────────────
      - name: Compute changed Kotlin files
        id: changed_kt
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.kt$' > changed_kt_files.txt || true

          COUNT=$(wc -l < changed_kt_files.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "Changed .kt files ($COUNT):"
            cat changed_kt_files.txt
          else
            echo "No changed .kt files — checks will still run (full tree) but cannot fail on changed-file scope."
          fi

      # ── ktlint — full tree, Checkstyle XML output ─────────────────────────
      - name: Run ktlint check
        id: ktlint
        run: ./gradlew ktlintCheck --stacktrace
        continue-on-error: true   # parse results before deciding pass/fail

      # ── Annotate PR: ktlint violations in changed files ───────────────────
      - name: Annotate changed files — ktlint violations
        id: ktlint_annotate
        if: steps.changed_kt.outputs.count != '0'
        run: |
          VIOLATIONS=0
          # ktlint emits Checkstyle XML: build/reports/ktlint/**/*.xml
          while IFS= read -r ktfile; do
            ABS="$GITHUB_WORKSPACE/$ktfile"
            # Find the matching Checkstyle report for this file
            while IFS= read -r xml; do
              # Extract <error> nodes whose filename attribute matches our file
              python3 - "$xml" "$ABS" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          report, target = sys.argv[1], sys.argv[2]
          try:
              tree = ET.parse(report)
          except Exception:
              sys.exit(0)
          for fnode in tree.findall('file'):
              if fnode.get('name') == target:
                  for err in fnode.findall('error'):
                      line = err.get('line', '1')
                      col  = err.get('column', '1')
                      msg  = err.get('message', '')
                      src  = err.get('source', 'ktlint')
                      print(f"::error file={target},line={line},col={col}::[ktlint] {msg} ({src})")
          PYEOF
            done < <(find . -path "*/build/reports/ktlint/*.xml" -type f 2>/dev/null)

            # Check if any violations were emitted for this file
            MATCH=$(find . -path "*/build/reports/ktlint/*.xml" -exec \
              grep -l "$(basename "$ABS")" {} \; 2>/dev/null | head -1)
            if [ -n "$MATCH" ]; then
              HIT=$(python3 -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('$MATCH')
          hits = [f for f in tree.findall('file') if f.get('name') == '$ABS' and f.findall('error')]
          print(len(hits))
          " 2>/dev/null || echo 0)
              VIOLATIONS=$((VIOLATIONS + HIT))
            fi
          done < changed_kt_files.txt
          echo "ktlint_violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::ktlint found $VIOLATIONS violation(s) in changed Kotlin files. Fix them before merging."
          fi

      # ── Detekt — full tree ─────────────────────────────────────────────────
      - name: Run Detekt
        id: detekt
        run: ./gradlew detekt --stacktrace
        continue-on-error: true   # parse results before deciding pass/fail

      # ── Annotate PR: Detekt violations in changed files ───────────────────
      - name: Annotate changed files — Detekt violations
        id: detekt_annotate
        if: steps.changed_kt.outputs.count != '0'
        run: |
          VIOLATIONS=0
          while IFS= read -r ktfile; do
            ABS="$GITHUB_WORKSPACE/$ktfile"
            while IFS= read -r xml; do
              python3 - "$xml" "$ABS" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          report, target = sys.argv[1], sys.argv[2]
          try:
              tree = ET.parse(report)
          except Exception:
              sys.exit(0)
          for fnode in tree.findall('file'):
              if fnode.get('name') == target:
                  for err in fnode.findall('error'):
                      line = err.get('line', '1')
                      col  = err.get('column', '1')
                      msg  = err.get('message', '')
                      src  = err.get('source', 'detekt')
                      sev  = err.get('severity', 'error')
                      level = 'warning' if sev == 'warning' else 'error'
                      print(f"::{level} file={target},line={line},col={col}::[detekt/{src.split('.')[-1]}] {msg}")
          PYEOF
            done < <(find . -path "*/build/reports/detekt/*.xml" -type f 2>/dev/null)

            MATCH=$(find . -path "*/build/reports/detekt/*.xml" -exec \
              grep -l "$(basename "$ABS")" {} \; 2>/dev/null | head -1)
            if [ -n "$MATCH" ]; then
              HIT=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('$MATCH')
          hits = [f for f in tree.findall('file')
                  if f.get('name') == '$ABS'
                  and any(e.get('severity','error') == 'error' for e in f.findall('error'))]
          print(len(hits))
          " 2>/dev/null || echo 0)
              VIOLATIONS=$((VIOLATIONS + HIT))
            fi
          done < changed_kt_files.txt
          echo "detekt_violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::Detekt found $VIOLATIONS file(s) with error-level violations in changed Kotlin files. Fix them before merging."
          fi

      # ── Fail the job when either tool found violations in changed files ────
      - name: Block merge on violations in changed Kotlin files
        run: |
          KTLINT_FAIL="${{ steps.ktlint.outcome }}"
          DETEKT_FAIL="${{ steps.detekt.outcome }}"
          KT_VIOL="${{ steps.ktlint_annotate.outputs.ktlint_violations || '0' }}"
          DK_VIOL="${{ steps.detekt_annotate.outputs.detekt_violations || '0' }}"
          CHANGED="${{ steps.changed_kt.outputs.count }}"

          echo "ktlint outcome  : $KTLINT_FAIL"
          echo "detekt outcome  : $DETEKT_FAIL"
          echo "ktlint violations in changed files : $KT_VIOL"
          echo "detekt violations in changed files : $DK_VIOL"

          FAIL=0

          # If there are changed files, fail only when those files have violations.
          if [ "$CHANGED" -gt 0 ]; then
            [ "$KT_VIOL" -gt 0 ] && FAIL=1
            [ "$DK_VIOL" -gt 0 ] && FAIL=1
          else
            # No changed .kt files — nothing to block on.
            # Tool failures (style violations in unchanged files) are visible in
            # the step logs and SARIF upload but should not block a PR that
            # touches no Kotlin sources.
            echo "No changed .kt files — skipping violation gate."
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "❌ ktlint + Detekt gate FAILED — resolve the violations above before merging."
            exit 1
          fi

          echo ""
          echo "✅ ktlint + Detekt gate PASSED — no violations in changed Kotlin files."

      # ── SARIF upload (informational, non-blocking) ─────────────────────────
      - name: Upload Detekt SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "**/build/reports/detekt/*.sarif"
        continue-on-error: true   # SARIF upload is informational

      # ── Artifact uploads for investigation ────────────────────────────────
      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports-${{ github.run_number }}
          path: "**/build/reports/ktlint/"
          retention-days: 7

      - name: Upload Detekt HTML reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports-${{ github.run_number }}
          path: "**/build/reports/detekt/"
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 5. JaCoCo Gate — combined domain + data coverage ≥ 70%
  #    Calls the check-coverage.sh script (Requirement 19.5)
  # ──────────────────────────────────────────────────────────────────────────
  jacoco-gate:
    name: jacoco-gate
    runs-on: ubuntu-latest
    needs: android-unit-tests
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aiassistant"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.aiassistant.debug"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      - name: Generate JaCoCo reports for domain and data modules
        run: ./gradlew :domain:jacocoTestReport :data:jacocoTestReport --stacktrace

      - name: Make coverage script executable
        run: chmod +x .github/scripts/check-coverage.sh

      - name: Enforce combined coverage ≥ 70%
        run: .github/scripts/check-coverage.sh "$GITHUB_WORKSPACE" 70

      - name: Post coverage comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          script: |
            const pct = process.env.coverage_pct || 'N/A';
            const emoji = parseFloat(pct) >= 70 ? '✅' : '❌';
            const body = `### ${emoji} JaCoCo Coverage Report\n\n` +
              `**Combined (domain + data): ${pct}%** (threshold: 70%)\n\n` +
              `_Generated for commit \`${context.sha.substring(0, 7)}\`_`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload JaCoCo HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports-${{ github.run_number }}
          path: |
            domain/build/reports/jacoco/
            data/build/reports/jacoco/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Hilt Audit — verify dependency injection graph
  # ──────────────────────────────────────────────────────────────────────────
  hilt-audit:
    name: Hilt Audit
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aiassistant"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.aiassistant.debug"}},"oauth_client":[],"api_key":[{"current_key":"CI_PLACEHOLDER_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      - name: Run Hilt binding check (KSP)
        run: ./gradlew :app:kspDebugKotlin --stacktrace

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Backend Unit Tests — pytest backend/tests/unit/
  #    (Requirement 20.3)
  # ──────────────────────────────────────────────────────────────────────────
  backend-unit-tests:
    name: backend-unit-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend unit tests
        env:
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars!"
          DATABASE_URL: "postgresql+asyncpg://testuser:testpass@localhost:5432/testdb"
          REDIS_URL: "redis://localhost:6379/0"
          AES_ENCRYPTION_KEY: ${{ secrets.AES_ENCRYPTION_KEY_CI }}
          OPENAI_API_KEY: "sk-test-not-real"
          GEMINI_API_KEY: "test-gemini-not-real"
          ANTHROPIC_API_KEY: "sk-ant-test-not-real"
          OLLAMA_BASE_URL: "http://localhost:11434"
          MINIO_ENDPOINT: "localhost:9000"
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin123"
          MINIO_BUCKET: "test-bucket"
          LOKI_URL: ""
          ENVIRONMENT: "test"
          LOG_LEVEL: "WARNING"
        run: |
          pytest tests/unit/ \
            --junit-xml=unit-test-results.xml \
            -v \
            --tb=short

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Backend Unit Test Results (PR)
          path: backend/unit-test-results.xml
          reporter: java-junit
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}
          list-files: listing

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports-${{ github.run_number }}
          path: backend/.pytest_cache/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Backend Integration Tests — pytest backend/tests/integration/
  #    All tests are fully mocked — no live DB/Redis/MinIO required.
  #    pytest-xdist distributes test files across CPU workers in parallel.
  #    pytest-timeout kills any single test that hangs beyond 30 s.
  #    Job-level timeout-minutes: 15 prevents the whole job from blocking CI.
  #    (Requirement 20.4)
  # ──────────────────────────────────────────────────────────────────────────
  backend-integration-tests:
    name: backend-integration-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars!"
          DATABASE_URL: "postgresql+asyncpg://testuser:testpass@localhost:5432/testdb"
          REDIS_URL: "redis://localhost:6379/0"
          AES_ENCRYPTION_KEY: ${{ secrets.AES_ENCRYPTION_KEY_CI }}
          OPENAI_API_KEY: "sk-test-not-real"
          GEMINI_API_KEY: "test-gemini-not-real"
          ANTHROPIC_API_KEY: "sk-ant-test-not-real"
          OLLAMA_BASE_URL: "http://localhost:11434"
          MINIO_ENDPOINT: "localhost:9000"
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin123"
          MINIO_BUCKET: "test-bucket"
          LOKI_URL: ""
          ENVIRONMENT: "test"
          LOG_LEVEL: "WARNING"
        run: |
          pytest tests/integration/ \
            --junit-xml=integration-test-results.xml \
            --timeout=30 \
            -n auto --dist=loadfile \
            -v --tb=short

      - name: Publish integration test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Backend Integration Test Results (PR)
          path: backend/integration-test-results.xml
          reporter: java-junit
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}
          list-files: listing

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports-${{ github.run_number }}
          path: |
            backend/integration-test-results.xml
            backend/.pytest_cache/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 8. Build Signed APK — merge-to-main only
  #    Produces signed release APK artifact on every push to main.
  #    (Requirement 20.3)
  # ──────────────────────────────────────────────────────────────────────────
  build-signed-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch'
    environment: production

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Using google-services.json from secret"
          else
            echo "GOOGLE_SERVICES_JSON secret not set — using committed placeholder"
          fi

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Using release keystore from secret"
          else
            echo "KEYSTORE_BASE64 secret not set — generating temporary debug keystore"
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storetype PKCS12
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute version name and code from Git
        id: version
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")-${{ github.run_number }}
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE"  >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME  Code: $VERSION_CODE"

      - name: Build signed release APK
        env:
          HAS_KEYSTORE: ${{ steps.keystore.outputs.has_keystore }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            EFFECTIVE_KEY_ALIAS="$SECRET_KEY_ALIAS"
            EFFECTIVE_KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            EFFECTIVE_STORE_PASSWORD="$SECRET_STORE_PASSWORD"
          else
            EFFECTIVE_KEY_ALIAS="androiddebugkey"
            EFFECTIVE_KEY_PASSWORD="android"
            EFFECTIVE_STORE_PASSWORD="android"
          fi

          ./gradlew :app:assembleCloudRelease \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$EFFECTIVE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$EFFECTIVE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$EFFECTIVE_KEY_PASSWORD" \
            --stacktrace

      - name: Locate signed APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/cloud/release -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/cloud/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build release notes for Firebase
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            NOTES=$(git log "${PREVIOUS_TAG}..HEAD" \
              --pretty=format:"• %s" \
              --no-merges | head -20)
          else
            NOTES="• Build #${{ github.run_number }} from main branch"
          fi
          CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"
          if [[ -n "$CUSTOM_NOTES" ]]; then
            FULL_NOTES="$CUSTOM_NOTES"$'\n\n'"$NOTES"
          else
            FULL_NOTES="v${{ steps.version.outputs.version_name }} — main branch"$'\n\n'"$NOTES"
          fi
          echo "$FULL_NOTES" > firebase-release-notes.txt
          echo "Release notes:"
          cat firebase-release-notes.txt

      - name: Check Firebase credentials
        id: firebase_check
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$FIREBASE_APP_ID" || -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  FIREBASE_APP_ID or FIREBASE_SERVICE_ACCOUNT secret is not set — skipping Firebase distribution"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Distribute APK via Firebase App Distribution
        id: firebase_distribute
        if: steps.firebase_check.outputs.skip != 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotesFile: firebase-release-notes.txt

      - name: Clean up keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Write build summary
        run: |
          echo "### ✅ Signed APK Built & Distributed — v${{ steps.version.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Name | \`${{ steps.version.outputs.version_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Code | \`${{ steps.version.outputs.version_code }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | release-apk-${{ steps.version.outputs.version_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Firebase Account | kotlinfiroj@gmail.com |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tester Groups | \`${{ secrets.FIREBASE_TESTER_GROUPS }}\` |" >> "$GITHUB_STEP_SUMMARY"

