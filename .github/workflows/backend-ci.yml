# ============================================================================
# Backend CI/CD Pipeline — Production Grade
# ============================================================================
#
# Triggers:
#   pull_request  →  targets main or develop; paths: backend/**, workflow file
#   push          →  main branch, same path filter
#   workflow_dispatch  →  manual trigger with optional deploy_env input
#
# PR Required Status Checks:
#   • backend-ci / lint-and-type-check
#   • backend-ci / unit-tests
#   • backend-ci / integration-tests
#
# Main-branch Jobs:
#   • backend-ci / build-and-push    — multi-arch Docker image to GHCR
#   • backend-ci / deploy-staging    — rolling update on staging environment
#   • backend-ci / smoke-test        — verify /health after deploy
#   • backend-ci / deploy-production — gated behind manual approval
#
# Required Secrets:
#   STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY  — staging server
#   PROD_SSH_HOST,    PROD_SSH_USER,    PROD_SSH_KEY      — production server
#   SLACK_WEBHOOK_URL  — Slack notifications (optional)
#
# Required Variables (repository-level):
#   STAGING_COMPOSE_PATH   — absolute path to docker-compose.yml on staging host
#   PROD_COMPOSE_PATH      — absolute path to docker-compose.yml on prod host
# ============================================================================

name: backend-ci

on:
  pull_request:
    branches:
      - main
      - develop
      - Develop_Main
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Deploy target: staging | production"
        required: false
        default: "staging"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend

jobs:

