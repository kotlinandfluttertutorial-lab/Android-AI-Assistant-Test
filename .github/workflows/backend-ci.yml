  # ──────────────────────────────────────────────────────────────────────────
  # 4. Build & Push Multi-Arch Docker Image — main branch push
  #    Also triggered for merge-to-main as part of the release flow.
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write   # for OIDC / cosign signing

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute lowercase image name
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/backend"
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Android AI Assistant Backend
            org.opencontainers.image.description=FastAPI backend for Android AI Assistant
            org.opencontainers.image.vendor=AI Assistant Team

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"

      - name: Sign image with cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

      - name: Generate image summary
        run: |
          echo "### 🐳 Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags | \`latest\`, \`sha-${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | linux/amd64, linux/arm64 |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Deploy to Staging
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://api.handsonandroid.com

    steps:
      - name: Skip if SSH secrets not configured
        id: check
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          if [ -z "$STAGING_SSH_HOST" ]; then
            echo "STAGING_SSH_HOST secret not set — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to staging via SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.STAGING_COMPOSE_PATH }}"
            docker compose pull backend celery_worker
            docker compose up -d --no-deps --remove-orphans backend celery_worker
            docker image prune -f
            echo "✅ Staging deploy complete — image: ${{ needs.build-and-push.outputs.image_digest }}"

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Smoke Test after Staging Deploy
  # ──────────────────────────────────────────────────────────────────────────
  smoke-test-staging:
    name: Smoke Test — Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: >-
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch') &&
      needs.deploy-staging.result == 'success'
    environment:
      name: staging

    steps:
      - name: Wait for service to be healthy
        run: sleep 30

      - name: Health check
        run: |
          HTTP_STATUS=$(curl -sSo /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 10 --retry-connrefused \
            "https://api.handsonandroid.com/health")
          echo "Health endpoint returned: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Smoke test failed — /health returned $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Smoke test passed"

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Deploy to Production — requires manual approval
  # ──────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - smoke-test-staging
    if: >-
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'production')) &&
      needs.smoke-test-staging.result == 'success'
    environment:
      name: production
      url: https://api.handsonandroid.com

    steps:
      - name: Skip if SSH secrets not configured
        id: check
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          if [ -z "$PROD_SSH_HOST" ]; then
            echo "PROD_SSH_HOST secret not set — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to production via SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.PROD_COMPOSE_PATH }}"
            docker compose pull backend celery_worker
            docker compose up -d --no-deps --remove-orphans backend celery_worker
            docker image prune -f
            echo "✅ Production deploy complete"

      - name: Production smoke test
        if: steps.check.outputs.skip != 'true'
        run: |
          HTTP_STATUS=$(curl -sSo /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 15 --retry-connrefused \
            "https://api.handsonandroid.com/health")
          echo "Health endpoint returned: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Production smoke test failed — /health returned $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Production smoke test passed"

  # ──────────────────────────────────────────────────────────────────────────
  # 8. Slack Notification
  # ──────────────────────────────────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - deploy-staging
      - deploy-production
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Notify Slack
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy-production.result == 'success' && '✅ Backend production deploy succeeded' || (needs.deploy-staging.result == 'success' && '✅ Backend staging deploy succeeded' || '❌ Backend CI/CD pipeline failed') }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Android AI Assistant — Backend Pipeline*\n\n• *Image:* `${{ needs.build-and-push.outputs.image_digest }}`\n• *Staging:* ${{ needs.deploy-staging.result }}\n• *Production:* ${{ needs.deploy-production.result }}\n• *Commit:* <${{ github.event.head_commit.url }}|${{ github.sha }}>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
