  # ──────────────────────────────────────────────────────────────────────────
  # 2. Backend Unit Tests — pytest backend/tests/unit/
  #    (Requirement 20.3)
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Backend Unit Tests (≥70% coverage)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        env:
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars!"
          DATABASE_URL: "postgresql+asyncpg://testuser:testpass@localhost:5432/testdb"
          REDIS_URL: "redis://localhost:6379/0"
          AES_ENCRYPTION_KEY: ${{ secrets.AES_ENCRYPTION_KEY_CI }}
          OPENAI_API_KEY: "sk-test-not-real"
          GEMINI_API_KEY: "test-gemini-not-real"
          ANTHROPIC_API_KEY: "sk-ant-test-not-real"
          OLLAMA_BASE_URL: "http://localhost:11434"
          MINIO_ENDPOINT: "localhost:9000"
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin123"
          MINIO_BUCKET: "test-bucket"
          LOKI_URL: ""
          ENVIRONMENT: "test"
          LOG_LEVEL: "WARNING"
        run: |
          pytest tests/unit/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70 \
            --junit-xml=unit-test-results.xml \
            -v \
            --tb=short

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Unit Test Results
          path: backend/unit-test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend-unit
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_number }}
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 14

