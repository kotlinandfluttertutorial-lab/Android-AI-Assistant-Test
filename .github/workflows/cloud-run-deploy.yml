# ============================================================================
# Cloud Run Deploy Pipeline â€” â‚¹0â€“â‚¹1,000/month Budget Architecture
# ============================================================================
#
# Purpose:
#   Deploy the FastAPI backend to Google Cloud Run on every push to main.
#   This is the budget-first production path documented in
#   docs/CLOUD_RUN_DEPLOYMENT.md.
#
# Architecture:
#   Cloud Run (FastAPI) â†’ Neon PostgreSQL + ChromaDB on Cloud Run
#                       â†’ Cloud Storage (file uploads, replaces MinIO)
#                       â†’ Secret Manager (all secrets)
#                       â†’ OpenAI / Gemini (pay-per-token)
#
# What this workflow does on every push to main:
#   1. Builds a multi-arch Docker image from backend/Dockerfile
#   2. Pushes to Artifact Registry
#   3. Runs Alembic migrations as a Cloud Run Job
#   4. Deploys the new revision to Cloud Run
#   5. Smoke-tests /health and /ready
#
# Authentication:
#   Workload Identity Federation â€” no long-lived service account key files.
#   See docs/CLOUD_RUN_DEPLOYMENT.md Step 11.1 for one-time WIF setup.
#
# Required GitHub Secrets (Settings â†’ Secrets â†’ Actions):
#   GCP_PROJECT_ID         â€” GCP project ID, e.g. android-ai-assistant
#   GCP_REGION             â€” Deploy region, e.g. asia-south1
#   GCP_WIF_PROVIDER       â€” Full WIF provider resource name
#   GCP_SERVICE_ACCOUNT    â€” SA email, e.g. ai-assistant-backend@PROJECT.iam.gserviceaccount.com
#   CLOUD_RUN_SERVICE      â€” Cloud Run service name, e.g. ai-assistant-backend
#   CLOUD_RUN_SERVICE_URL  â€” Full HTTPS URL of the Cloud Run service (set after first deploy)
#   CHROMA_SERVICE_NAME    â€” Cloud Run service name for ChromaDB, e.g. chromadb
#   SQL_CONN_NAME          â€” Cloud SQL connection name (only if/when you migrate to Cloud SQL)
#
# Optional â€” only needed when Cloud SQL is added later:
#   SQL_CONN_NAME          â€” e.g. android-ai-assistant:asia-south1:ai-assistant-db
#
# Required GitHub Variables (Settings â†’ Variables â†’ Actions):
#   GCP_ARTIFACT_REPO      â€” Artifact Registry repo name, e.g. backend
#
# Cost guard:
#   min-instances: 0  â†’ service scales to zero when unused
#   max-instances: 2  â†’ hard cap on parallel instances
#   concurrency: 40   â†’ one instance handles 40 parallel requests before scaling
#
# Trigger:
#   push â†’ main (after tests pass in backend-ci.yml)
#   workflow_dispatch (manual)
# ============================================================================

name: cloud-run-deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/cloud-run-deploy.yml"
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip Alembic migrations (use when schema has not changed)"
        required: false
        default: "false"

concurrency:
  group: cloud-run-deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel â€” a cancelled build loses its outputs and breaks downstream jobs

env:
  PYTHON_VERSION: "3.11"

jobs:

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 1. Build and push Docker image to Artifact Registry
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # WIF requires this

    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx (multi-arch)
        uses: docker/setup-buildx-action@v3

      - name: Compute image reference
        id: image
        run: |
          # Use vars.GCP_PROJECT_ID (not secrets) so the image reference is
          # not redacted by GitHub Actions secret masking.
          # GitHub suppresses job outputs that contain secret values, which
          # caused IMAGE to be empty in downstream jobs (migrate/deploy/worker).
          REPO="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/api"
          TAG="sha-${{ github.sha }}"
          REF="$REPO:$TAG"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image reference: $REF"
          # Fail immediately if variables are not set
          if [[ "$REPO" == *"//"* ]]; then
            echo "::error::Image path contains double slash: $REPO"
            echo "Ensure GCP_PROJECT_ID and GCP_ARTIFACT_REPO are set as GitHub Actions Variables (not secrets)."
            exit 1
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          # amd64 only â€” arm64 is slow on GitHub hosted runners and not needed yet
          # Add linux/arm64 when you need it (costs 2Ã— build time)
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/api:latest
          cache-from: type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/api:buildcache
          cache-to: type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/api:buildcache,mode=max
          provenance: false   # keeps image manifest simple; enable when you need SLSA

      - name: Image summary
        run: |
          echo "### ðŸ³ Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.image.outputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          # Debug: verify output is non-empty before downstream jobs consume it
          if [[ -z "${{ steps.image.outputs.ref }}" ]]; then
            echo "::error::steps.image.outputs.ref is empty after build â€” downstream jobs will fail."
            echo "Check that GCP_ARTIFACT_REPO variable is set in GitHub Actions variables."
            exit 1
          fi
          echo "âœ… Image output verified: ${{ steps.image.outputs.ref }}"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 2. Run Alembic migrations as a Cloud Run Job
  #
  #    Creates the job on first run; updates it on subsequent runs.
  #    Runs alembic upgrade head then exits â€” billed only for execution time.
  #    Skip with workflow_dispatch input skip_migrations=true when schema
  #    has not changed to save ~30 seconds of deploy time.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  migrate:
    name: Alembic Migrate
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && github.event.inputs.skip_migrations != 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Create or update migration job
        # Uses || true so the create does not fail if the job already exists;
        # the update path is taken on all subsequent runs.
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          REGION="${{ vars.GCP_REGION }}"
          SA="${{ secrets.GCP_SERVICE_ACCOUNT }}"

          if [[ -z "$IMAGE" ]]; then
            echo "::error::IMAGE is empty â€” needs.build.outputs.image was not set."
            echo "Trigger a fresh full workflow run instead of re-running individual failed jobs."
            exit 1
          fi

          # Try update first (fastest path on repeat deploys)
          gcloud run jobs update alembic-migrate \
            --image="$IMAGE" \
            --region="$REGION" \
            --quiet \
          || \
          # Create on first run
          gcloud run jobs create alembic-migrate \
            --image="$IMAGE" \
            --region="$REGION" \
            --service-account="$SA" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,REDIS_URL=REDIS_URL:latest,AES_ENCRYPTION_KEY=AES_ENCRYPTION_KEY:latest" \
            --set-env-vars="STORAGE_BACKEND=gcs,ENVIRONMENT=production" \
            --command="python" \
            --args="-m,alembic,upgrade,head" \
            --max-retries=1 \
            --quiet

      - name: Execute migration
        run: |
          gcloud run jobs execute alembic-migrate \
            --region="${{ vars.GCP_REGION }}" \
            --wait \
            --quiet
          echo "âœ… Alembic migrations complete"

      - name: Show migration logs on failure
        if: failure()
        continue-on-error: true  # logging.viewer may not be granted â€” don't block on diagnostic step
        run: |
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="alembic-migrate"' \
            --limit=50 \
            --format="value(textPayload)" \
            --project="${{ vars.GCP_PROJECT_ID }}"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 3. Deploy new revision to Cloud Run
  #
  #    All secrets come from Secret Manager â€” no .env file on the container.
  #    Non-secret env vars are inlined here.
  #    Cost guards: min-instances=0, max-instances=2, concurrency=40.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build, migrate]
    # Run even if migrate was skipped (when skip_migrations=true)
    if: always() && needs.build.result == 'success'

    permissions:
      contents: read
      id-token: write

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get ChromaDB internal URL
        id: chroma
        run: |
          # ChromaDB runs with ingress=internal. Cloud Run service-to-service calls
          # within the same project must use the project-number-based URL
          # (e.g. chromadb-106071012091.asia-south1.run.app), NOT the external
          # hash URL (chromadb-yyjr66r2zq-el.a.run.app).
          # status.url returns the external URL; we extract the internal one from
          # the urls annotation which lists both.
          RAW=$(gcloud run services describe "${{ secrets.CHROMA_SERVICE_NAME }}" \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(metadata.annotations["run.googleapis.com/urls"])' \
            --quiet 2>/dev/null || echo "")

          # The annotation is a JSON array like ["https://svc-PROJNUM.region.run.app","https://svc-hash.region.run.app"]
          # Pick the entry that contains the project number (all digits segment).
          PROJECT_NUM=$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" \
            --format="value(projectNumber)" --quiet 2>/dev/null || echo "")

          if [[ -n "$PROJECT_NUM" && -n "$RAW" ]]; then
            HOST=$(echo "$RAW" | tr ',' '\n' | tr -d '[]"' \
              | grep "$PROJECT_NUM" | sed 's|https://||' | tr -d ' ' | head -1)
          fi

          # Fall back to stripping status.url if annotation parsing failed
          if [[ -z "$HOST" ]]; then
            HOST=$(gcloud run services describe "${{ secrets.CHROMA_SERVICE_NAME }}" \
              --region="${{ vars.GCP_REGION }}" \
              --format="value(status.url)" \
              --quiet 2>/dev/null \
              | sed 's|https://||' \
              || echo "chromadb-not-deployed")
          fi

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "ChromaDB host: $HOST"

      - name: Ensure ChromaDB min-instances=1 (keep warm)
        # ChromaDB scaling to zero causes 30-60s cold starts which exceed the
        # backend's query timeout. Keep at least one instance always warm.
        # This is idempotent â€” safe to run on every deploy.
        run: |
          if [[ "${{ steps.chroma.outputs.host }}" != "chromadb-not-deployed" ]]; then
            gcloud run services update "${{ secrets.CHROMA_SERVICE_NAME }}" \
              --region="${{ vars.GCP_REGION }}" \
              --min-instances=1 \
              --quiet \
              2>/dev/null || echo "Warning: could not set ChromaDB min-instances (continuing)"
          else
            echo "ChromaDB not deployed â€” skipping min-instances update"
          fi

      - name: Validate image reference
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          if [[ -z "$IMAGE" ]]; then
            echo "::error::needs.build.outputs.image is empty â€” cannot deploy without an image."
            echo "Trigger a fresh full workflow run instead of re-running individual failed jobs."
            exit 1
          fi
          echo "Deploying image: $IMAGE"

      - name: Clear conflicting secret-type env vars from Cloud Run
        # GOOGLE_CLIENT_ID and GOOGLE_ANDROID_CLIENT_ID were previously set as
        # secret references via --update-secrets. Cloud Run refuses to change a
        # variable from secret-ref type to string literal via --update-env-vars.
        # Use --remove-secrets to clear them first so the deploy step can
        # re-add them as plain string env vars.
        run: |
          gcloud run services update ${{ secrets.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --remove-secrets=GOOGLE_CLIENT_ID,GOOGLE_ANDROID_CLIENT_ID \
            --quiet || true  # ignore error if vars don't exist as secrets
        continue-on-error: true

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          flags: >-
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=1Gi
            --concurrency=40
            --port=8000
            --allow-unauthenticated
            --ingress=all
            --timeout=300
          secrets: |-
            SECRET_KEY=SECRET_KEY:latest
            AES_ENCRYPTION_KEY=AES_ENCRYPTION_KEY:latest
            DATABASE_URL=DATABASE_URL:latest
            REDIS_URL=REDIS_URL:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
          env_vars: |-
            ENVIRONMENT=production
            LOG_LEVEL=INFO
            STORAGE_BACKEND=gcs
            GCS_BUCKET_NAME=${{ vars.GCP_PROJECT_ID }}-files
            CHROMA_HOST=${{ steps.chroma.outputs.host }}
            CHROMA_PORT=8000
            CHROMA_SSL=true
            DEFAULT_LLM_PROVIDER=gemini
            LLM_FALLBACK_PROVIDER=openai
            GOOGLE_CLIENT_ID=106071012091-d4brm5cng1gaor0al51veafjd0fa239v.apps.googleusercontent.com
            GOOGLE_ANDROID_CLIENT_ID=106071012091-0cu6q2e6b4tsa1qrauutqt70ms13otn6.apps.googleusercontent.com
            LLM_MAX_OUTPUT_TOKENS_OPENAI=2048
            LLM_MAX_OUTPUT_TOKENS_GEMINI=4096
            LLM_MAX_OUTPUT_TOKENS_CLAUDE=2048
            PROMETHEUS_ENABLED=true
            LOKI_URL=
            DP_EPSILON=1.0

      - name: Deploy summary
        run: |
          echo "### ðŸš€ Cloud Run Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`${{ secrets.CLOUD_RUN_SERVICE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.deploy.outputs.url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ needs.build.outputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 3b. Deploy Celery worker as a second Cloud Run service
  #
  #     Same image as the API â€” entrypoint.sh reads APP_MODE=worker and runs
  #     `celery ... worker` instead of uvicorn.
  #
  #     Key differences from the API service:
  #       min-instances=1   â€” worker must always be running to drain the queue;
  #                           a cold-start delay would leave jobs stuck "queued"
  #       max-instances=1   â€” one worker is enough at this scale; increase later
  #       no-cpu-throttling â€” Celery needs the CPU between requests (not just
  #                           during HTTP handling), so throttling must be off
  #       no HTTP port      â€” worker does not serve HTTP, but Cloud Run requires
  #                           a port binding; we bind 8080 and the process does
  #                           not listen on it (Cloud Run won't probe it because
  #                           no-allow-unauthenticated services skip liveness
  #                           probes by default on internal traffic)
  #       --ingress=internal â€” worker is not reachable from the public internet
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  deploy-worker:
    name: Deploy Celery Worker
    runs-on: ubuntu-latest
    needs: [build, migrate]
    if: always() && needs.build.result == 'success'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get ChromaDB internal URL
        id: chroma
        run: |
          RAW=$(gcloud run services describe "${{ secrets.CHROMA_SERVICE_NAME }}" \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(metadata.annotations["run.googleapis.com/urls"])' \
            --quiet 2>/dev/null || echo "")
          PROJECT_NUM=$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" \
            --format="value(projectNumber)" --quiet 2>/dev/null || echo "")
          if [[ -n "$PROJECT_NUM" && -n "$RAW" ]]; then
            HOST=$(echo "$RAW" | tr ',' '\n' | tr -d '[]"' \
              | grep "$PROJECT_NUM" | sed 's|https://||' | tr -d ' ' | head -1)
          fi
          if [[ -z "$HOST" ]]; then
            HOST=$(gcloud run services describe "${{ secrets.CHROMA_SERVICE_NAME }}" \
              --region="${{ vars.GCP_REGION }}" \
              --format="value(status.url)" \
              --quiet 2>/dev/null \
              | sed 's|https://||' \
              || echo "chromadb-not-deployed")
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Deploy worker to Cloud Run
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          REGION="${{ vars.GCP_REGION }}"
          SA="${{ secrets.GCP_SERVICE_ACCOUNT }}"
          PROJECT="${{ vars.GCP_PROJECT_ID }}"

          # Fail fast with a clear message rather than letting gcloud fail silently
          if [[ -z "$IMAGE" ]]; then
            echo "::error::IMAGE is empty â€” needs.build.outputs.image was not set."
            echo "This usually means the workflow was re-run from a previously failed build job."
            echo "Trigger a fresh full workflow run (push a commit or use 'Re-run all jobs')."
            exit 1
          fi

          gcloud run deploy ai-assistant-worker \
            --image="$IMAGE" \
            --region="$REGION" \
            --service-account="$SA" \
            --set-secrets="SECRET_KEY=SECRET_KEY:latest,AES_ENCRYPTION_KEY=AES_ENCRYPTION_KEY:latest,DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --set-env-vars="APP_MODE=worker,ENVIRONMENT=production,LOG_LEVEL=INFO,STORAGE_BACKEND=gcs,GCS_BUCKET_NAME=${PROJECT}-files,CHROMA_HOST=${{ steps.chroma.outputs.host }},CHROMA_PORT=8000,CHROMA_SSL=true,DEFAULT_LLM_PROVIDER=gemini,LLM_FALLBACK_PROVIDER=openai" \
            --min-instances=1 \
            --max-instances=1 \
            --cpu=1 \
            --memory=1Gi \
            --no-cpu-throttling \
            --port=8080 \
            --ingress=internal \
            --no-allow-unauthenticated \
            --timeout=900 \
            --quiet

          echo "### ðŸ”§ Celery Worker Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`ai-assistant-worker\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`$IMAGE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | \`APP_MODE=worker\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Min instances | 1 (always warm) |" >> "$GITHUB_STEP_SUMMARY"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 4. Smoke test â€” /health and /ready
  #
  #    /health â†’ liveness: process is alive
  #    /ready  â†’ readiness: DB + Redis reachable, all required env vars present
  #    Both endpoints are implemented in backend/app/main.py.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy, deploy-worker]
    # Run as long as the API deploy succeeded, even if the worker deploy failed.
    if: always() && needs.deploy.result == 'success'

    steps:
      - name: Resolve service URL
        id: url
        run: |
          # Prefer the live URL emitted by the deploy step.
          # Fall back to the static CLOUD_RUN_SERVICE_URL secret when the action
          # output is empty (e.g. the step was skipped or the output was masked).
          LIVE="${{ needs.deploy.outputs.url }}"
          STATIC="${{ secrets.CLOUD_RUN_SERVICE_URL }}"
          if [[ -n "$LIVE" ]]; then
            SERVICE_URL="$LIVE"
            echo "Using deploy-step URL: $SERVICE_URL"
          elif [[ -n "$STATIC" ]]; then
            SERVICE_URL="$STATIC"
            echo "deploy-step URL was empty â€” using CLOUD_RUN_SERVICE_URL secret: $SERVICE_URL"
          else
            echo "::error::No service URL available. Set the CLOUD_RUN_SERVICE_URL secret."
            exit 1
          fi
          # Strip trailing slash to avoid double-slash in endpoint paths.
          SERVICE_URL="${SERVICE_URL%/}"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for revision to stabilise
        # Cloud Run cold-start with min-instances=0 can take 30-60 s on a fresh
        # deploy.  Give the service extra time before the first probe attempt.
        run: sleep 30

      - name: /health check
        run: |
          # --retry-all-errors: retry on ANY non-zero exit OR non-2xx HTTP status,
          # including Cloudflare 530 (origin unreachable) which occurs while the
          # Cloud Run revision is still starting up.
          # Total patience: 30 s initial wait + 8 attempts Ã— 15 s delay = ~150 s.
          HTTP=$(curl -sSo /dev/null -w "%{http_code}" \
            --retry 8 --retry-delay 15 --retry-all-errors \
            "${{ steps.url.outputs.service_url }}/health")
          echo "Health endpoint returned: $HTTP"
          if [[ "$HTTP" != "200" ]]; then
            echo "::error::Smoke test failed â€” /health returned $HTTP"
            exit 1
          fi
          echo "âœ… /health OK"

      - name: /ready check
        # /ready checks DB + Redis + env vars.
        # Redis is a placeholder until Upstash/Memorystore is added â€”
        # a non-200 here is a warning, not a hard failure.
        run: |
          RESPONSE=$(curl -sSo - -w "\nHTTP_STATUS:%{http_code}" \
            --retry 3 --retry-delay 5 \
            "${{ steps.url.outputs.service_url }}/ready" 2>/dev/null || echo "HTTP_STATUS:000")
          HTTP=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "/ready â†’ $HTTP"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          if [[ "$HTTP" == "200" ]]; then
            echo "âœ… /ready OK â€” all dependencies reachable"
          else
            echo "âš ï¸  /ready returned $HTTP â€” check dependency status above"
            echo "This is a warning, not a failure â€” Redis may not yet be configured"
          fi

      - name: Full smoke summary
        run: |
          echo "### âœ… Smoke Test Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Service URL: ${{ steps.url.outputs.service_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docs: ${{ steps.url.outputs.service_url }}/docs" >> "$GITHUB_STEP_SUMMARY"
