# ============================================================================
# Infrastructure Validation Pipeline — Production Grade
# ============================================================================
#
# Validates all infrastructure-as-code and configuration files on every PR
# that touches docker-compose, Nginx, Prometheus, Grafana, Loki, or
# Alembic migration files. Also runs on pushes to main.
#
# Triggers:
#   pull_request  →  targets main or develop; infrastructure paths only
#   push          →  main branch; infrastructure + alembic paths
#   workflow_dispatch  →  manual trigger
#
# PR Required Status Checks (configure as branch-protection rules on main):
#   • infrastructure-validation / validate-docker-compose
#   • infrastructure-validation / validate-nginx
#   • infrastructure-validation / validate-prometheus
#   • infrastructure-validation / validate-grafana
#   • infrastructure-validation / validate-alembic
#   • infrastructure-validation / validate-env
#
# Main-branch Jobs (push to main / workflow_dispatch):
#   • infrastructure-validation / integration-stack-test
#     — spins up the complete Docker Compose stack, runs health checks,
#       tears down (depends on all validate-* jobs)
# ============================================================================

name: infrastructure-validation

on:
  pull_request:
    branches:
      - main
      - develop
      - Develop_Main
    paths:
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - "infrastructure/**"
      - "backend/alembic/**"
      - "backend/Dockerfile"
      - ".env.example"
      - "backend/.env.example"
      - ".github/workflows/infrastructure-validation.yml"
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "infrastructure/**"
      - "backend/alembic/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Docker Compose Validation
  # ──────────────────────────────────────────────────────────────────────────
  validate-docker-compose:
    name: validate-docker-compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create stub backend/.env for config validation
        run: cp backend/.env.example backend/.env

      - name: Create stub env files for docker compose config validation
        run: |
          # docker-compose.yml uses ${COMPOSE_ENV_FILE:-.env.local} — create a
          # minimal stub so docker compose config can parse the file without error.
          cp .env.local.example .env.local || touch .env.local

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose config --quiet
          echo "✅ docker-compose.yml is valid"

      - name: Check all service images are pinned or buildable
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys, yaml

          with open("docker-compose.yml") as f:
              compose = yaml.safe_load(f)

          unpinned = []
          latest_no_build = []
          for name, svc in compose.get("services", {}).items():
              image = svc.get("image", "")
              build = svc.get("build", "")
              if image and ":" not in image:
                  unpinned.append(f"{name}: {image!r} (no tag)")
              elif image and image.endswith(":latest"):
                  if build:
                      print(f"⚠️  {name}: uses :latest tag — consider pinning for reproducibility")
                  else:
                      latest_no_build.append(f"{name}: {image!r} (uses :latest without a build context)")

          if unpinned:
              print("::error::Unpinned images found:")
              for u in unpinned:
                  print(f"  {u}")
              sys.exit(1)

          if latest_no_build:
              print("::error::Services using :latest tag without a build context found (pin the image digest or use a versioned tag):")
              for u in latest_no_build:
                  print(f"  {u}")
              sys.exit(1)

          print("✅ All images have explicit tags or are built from source")
          PYEOF

      - name: Check ChromaDB port does not conflict with backend
        run: |
          python3 - <<'PYEOF'
          import sys, yaml

          with open("docker-compose.yml") as f:
              compose = yaml.safe_load(f)

          chromadb_svc = compose.get("services", {}).get("chromadb", {})
          ports = chromadb_svc.get("ports", [])

          # CVE-2026-45829: ChromaDB port is intentionally NOT published to the
          # host (internal Docker network only) as a mitigation for the pre-auth
          # RCE vulnerability. No patch is available as of 2026-08-15.
          # This check validates that the port is NOT published.
          if ports:
              host_port = None
              for p in ports:
                  port_str = str(p)
                  parts = port_str.split(":")
                  # Handles three formats:
                  #   "8001"                  → host port 8001
                  #   "8001:8000"             → host port 8001
                  #   "127.0.0.1:8001:8000"   → host port 8001 (bind IP : host port : container port)
                  if len(parts) == 1:
                      host_port = int(parts[0])
                  elif len(parts) == 2:
                      host_port = int(parts[0])
                  else:
                      # ip:host_port:container_port — host port is the middle segment
                      host_port = int(parts[1])
                  break

              if host_port == 8000:
                  print("::error::ChromaDB host port 8000 conflicts with the backend API — use a different host port (e.g. 8001)")
                  sys.exit(1)

              print(f"⚠️  ChromaDB is publishing host port {host_port}. "
                    f"Ensure CVE-2026-45829 is patched before exposing this port.")
          else:
              print("✅ ChromaDB has no published host ports — internal network only (CVE-2026-45829 mitigation active)")

          PYEOF

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: false

      - name: Upload Dockerfile lint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-dockerfile
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Nginx Config Validation
  # ──────────────────────────────────────────────────────────────────────────
  validate-nginx:
    name: Validate Nginx Config
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(toJson(github.event.pull_request.changed_files), 'infrastructure/nginx/')

    steps:
      - uses: actions/checkout@v4

      - name: Test Nginx config syntax
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.25-alpine \
            nginx -t -c /etc/nginx/nginx.conf
          echo "✅ Nginx config is valid"

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Prometheus Config + Rules Validation
  # ──────────────────────────────────────────────────────────────────────────
  validate-prometheus:
    name: Validate Prometheus Config
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(toJson(github.event.pull_request.changed_files), 'infrastructure/prometheus/')

    steps:
      - uses: actions/checkout@v4

      - name: Install promtool
        run: |
          PROM_VERSION="2.51.0"
          curl -sSfL \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          chmod +x promtool
          sudo mv promtool /usr/local/bin/

      - name: Check Prometheus config
        run: |
          promtool check config infrastructure/prometheus/prometheus.yml
          echo "✅ Prometheus config is valid"

      - name: Check Prometheus alert rules (if present)
        run: |
          for f in infrastructure/prometheus/*.rules.yml infrastructure/prometheus/rules/*.yml; do
            [[ -f "$f" ]] || continue
            promtool check rules "$f"
            echo "✅ Rules file valid: $f"
          done

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Grafana Dashboard JSON Validation
  # ──────────────────────────────────────────────────────────────────────────
  validate-grafana:
    name: Validate Grafana Dashboards
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(toJson(github.event.pull_request.changed_files), 'infrastructure/grafana/')

    steps:
      - uses: actions/checkout@v4

      - name: Validate all dashboard JSON files
        run: |
          ERRORS=0
          for f in infrastructure/grafana/provisioning/dashboards/**/*.json; do
            [[ -f "$f" ]] || continue
            if python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
              echo "✅ Valid JSON: $f"
            else
              echo "::error file=$f::Invalid JSON in Grafana dashboard"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [[ "$ERRORS" -gt 0 ]]; then
            echo "::error::$ERRORS Grafana dashboard JSON file(s) are invalid"
            exit 1
          fi

      - name: Check Grafana datasource provisioning YAML
        run: |
          for f in infrastructure/grafana/provisioning/datasources/*.yml \
                   infrastructure/grafana/provisioning/datasources/*.yaml; do
            [[ -f "$f" ]] || continue
            python3 -c "import yaml,sys; yaml.safe_load(open('$f'))" \
              && echo "✅ Valid YAML: $f" \
              || (echo "::error file=$f::Invalid YAML" && exit 1)
          done

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Alembic Migration Chain Validation
  # ──────────────────────────────────────────────────────────────────────────
  validate-alembic:
    name: Validate Alembic Migrations
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(toJson(github.event.pull_request.changed_files), 'backend/alembic/')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: migrationtest
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d migrationtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply all migrations (upgrade head)
        env:
          DATABASE_URL: "postgresql+asyncpg://testuser:testpass@localhost:5432/migrationtest"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-migration-secret-key-must-be-at-least-32-chars!"
          PYTHONPATH: "."
        run: |
          alembic upgrade head
          echo "✅ All migrations applied successfully"

      - name: Verify downgrade path (head → base)
        env:
          DATABASE_URL: "postgresql+asyncpg://testuser:testpass@localhost:5432/migrationtest"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-migration-secret-key-must-be-at-least-32-chars!"
          PYTHONPATH: "."
        run: |
          alembic downgrade base
          echo "✅ Full downgrade to base succeeded"

      - name: Re-apply migrations after downgrade
        env:
          DATABASE_URL: "postgresql+asyncpg://testuser:testpass@localhost:5432/migrationtest"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-migration-secret-key-must-be-at-least-32-chars!"
          PYTHONPATH: "."
        run: |
          alembic upgrade head
          echo "✅ Re-apply after downgrade succeeded"

      - name: Check for multiple heads (invalid branch in migration chain)
        env:
          DATABASE_URL: "postgresql+asyncpg://testuser:testpass@localhost:5432/migrationtest"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-migration-secret-key-must-be-at-least-32-chars!"
          PYTHONPATH: "."
        run: |
          HEAD_COUNT=$(alembic heads 2>&1 | grep -c "head" || true)
          if [[ "$HEAD_COUNT" -gt 1 ]]; then
            echo "::error::Multiple Alembic heads detected — merge migration branches before merging this PR"
            alembic heads
            exit 1
          fi
          echo "✅ Single Alembic head — migration chain is clean"

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Environment Variables Completeness Check
  # ──────────────────────────────────────────────────────────────────────────
  validate-env:
    name: validate-env
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check that required env vars are documented
        run: |
          python3 - <<'PYEOF'
          import sys, re

          # Only vars that are [REQUIRED] in backend/.env.example (no built-in default).
          # Compose-level vars (POSTGRES_USER, MINIO_ROOT_USER, etc.) all have
          # inline defaults in docker-compose.yml and do not need to be listed here.
          REQUIRED_VARS = [
              "DATABASE_URL",
              "SECRET_KEY",
              "AES_ENCRYPTION_KEY",
              "BACKEND_TLS_PIN_SHA256",
          ]

          def load_keys(path):
              keys = set()
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if line and not line.startswith('#') and '=' in line:
                              keys.add(line.split('=', 1)[0].strip())
              except FileNotFoundError:
                  print(f"::warning::File not found: {path}")
              return keys

          root_keys    = load_keys(".env.example")
          backend_keys = load_keys("backend/.env.example")
          all_keys = root_keys | backend_keys

          missing = [v for v in REQUIRED_VARS if v not in all_keys]
          if missing:
              print("::error::Required environment variables missing from .env.example files:")
              for m in missing:
                  print(f"  {m}")
              sys.exit(1)

          print(f"✅ All {len(REQUIRED_VARS)} required env vars are documented in .env.example files")
          print(f"   Root .env.example: {len(root_keys)} vars")
          print(f"   Backend .env.example: {len(backend_keys)} vars")
          PYEOF

  # NOTE: Full stack integration test (docker compose up) was removed.
  # This project deploys to Google Cloud Run with GCS, Neon, and Upstash —
  # not the local Docker Compose stack (which uses MinIO, Postgres, Redis
  # containers). Spinning up the Compose stack in CI pulls images from quay.io
  # and other registries that require authentication, and it tests an
  # architecture that does not match production.
  #
  # Integration testing for production is covered by:
  #   • backend-ci.yml  — unit + integration tests with real Postgres/Redis services
  #   • cloud-run-deploy.yml — deploys to Cloud Run and smoke-tests /health + /ready
