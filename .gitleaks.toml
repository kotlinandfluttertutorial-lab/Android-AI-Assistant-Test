# Gitleaks configuration for the Android AI Assistant project.
# https://github.com/gitleaks/gitleaks

title = "Android AI Assistant — Gitleaks Config"

[extend]
# Extend the default gitleaks ruleset
useDefault = true

[[rules]]
id          = "gemini-api-key"
description = "Google Gemini / GCP API Key"
regex       = '''AIza[0-9A-Za-z\-_]{35}'''
tags        = ["key", "google", "gemini", "gcp"]

[[rules]]
id          = "google-oauth-client-secret"
description = "Google OAuth2 Client Secret"
regex       = '''GOCSPX-[0-9A-Za-z\-_]{28}'''
tags        = ["key", "google", "oauth"]

[[rules]]
id          = "aes-base64-key"
description = "Base64-encoded AES encryption key (32 bytes)"
regex       = '''AES_ENCRYPTION_KEY\s*=\s*[A-Za-z0-9+/]{43}='''
tags        = ["key", "aes", "encryption"]

[allowlist]
description = "Historical commits where GCP API keys were exposed before rotation. Keys have been revoked and replaced with placeholders. These fingerprints are suppressed to prevent noise on new PRs."
# Format: commit SHA of historical commits with revoked keys
commits = [
    "14bacc6365685d8bd06fb391cde6bc85c10582b1",
    "71f353df7dfa91352b1983050728a8d29313c9cc",
    "41db3754e88a3c9883b7bfbeb5faeb4f01463182",  # CI test AES_ENCRYPTION_KEY — test-only value, now moved to secret
    "156b4b50146ead2dbe55f1ef56193ff7f0879960",  # GEMINI_API_KEY — key has been revoked and rotated, script fixed
    "78531b1fe44f5abdf942128757e5c1f3b8ec8970",  # curl-auth-header in CLOUD_RUN_DEPLOYMENT.md — placeholder example
]

regexes = [
    '''your[_-].*key[_-]here''',
    '''changeme''',
    '''replace.with''',
    '''PLACEHOLDER''',
    # Canonical JWT example header used throughout documentation
    '''eyJhbGciOiJIUzI1NiJ9''',
    # Truncated example tokens in API docs (e.g. "eyJhbGciOiJIUzI1NiJ9...")
    '''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.\.\.$''',
    # CI test keys in DEVOPS_GUIDE.md — not real secrets
    '''ci-test-(secret|encryption)-key''',
    # curl doc examples: Bearer followed by an ALL_CAPS_PLACEHOLDER (e.g. ADMIN_JWT, YOUR_ADMIN_JWT, YOUR_JWT)
    # These are never real tokens — real JWTs always start with "eyJ"
    '''Bearer [A-Z][A-Z0-9_]+''',
]

