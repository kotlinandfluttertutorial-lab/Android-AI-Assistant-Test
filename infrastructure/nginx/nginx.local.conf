# ============================================================================
# Android AI Assistant — Nginx reverse proxy (LOCAL development)
# ============================================================================
#
# This file is mounted into the nginx container at:
#   /etc/nginx/nginx.conf
#
# It is used EXCLUSIVELY by docker-compose.local.yml.
# The production configuration lives in nginx.conf.
#
# Key differences from production (nginx.conf):
#   • Listens on port 8080 (not 80) to avoid conflicts with local services.
#   • Upstream service is named "backend" (matches docker-compose.local.yml).
#   • No TLS — local development uses plain HTTP / plain WS.
#   • Relaxed timeouts and body size limits for developer convenience.
#   • Binds to 0.0.0.0 so Android physical devices on the same LAN can connect.
#
# Android Emulator:
#   http://10.0.2.2:8080/      → REST API
#   ws://10.0.2.2:8080/ws/     → WebSocket
#
# Physical device (replace with your LAN IP):
#   http://192.168.x.x:8080/
#   ws://192.168.x.x:8080/ws/
# ============================================================================

daemon off;

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # ── Upstream — FastAPI backend ─────────────────────────────────────────
    # Deferred DNS resolution via variable + Docker's internal DNS (127.0.0.11)
    # so nginx -t passes without a live network and handles container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP server on port 8080 ──────────────────────────────────────────
    server {
        # Listen on all interfaces so Android physical devices on the LAN can
        # reach this server. Port 8080 avoids conflicts with port 80.
        listen 8080;
        server_name _;

        set $api_upstream http://backend:8000;

        # Allow larger file uploads (≥ MAX_FILE_SIZE_MB in backend settings)
        client_max_body_size 55m;

        # ── Health check endpoint ────────────────────────────────────────
        # Nginx-level health check used by docker-compose.local.yml healthcheck.
        location = /health {
            access_log off;
            return 200 '{"status":"UP","service":"nginx-local"}';
            add_header Content-Type application/json;
        }

        # ── WebSocket proxy ──────────────────────────────────────────────
        # Must be declared before the catch-all location block.
        # WebSocket connections are long-lived; raise read_timeout to 24 h.
        location /ws/ {
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;  # 24 h — keep streaming connections alive
        }

        # ── Standard HTTP proxy ──────────────────────────────────────────
        location / {
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering    off;
            proxy_read_timeout 120s;
        }
    }
}
