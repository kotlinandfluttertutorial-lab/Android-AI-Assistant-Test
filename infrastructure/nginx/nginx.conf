# ============================================================================
# Android AI Assistant — Nginx reverse proxy configuration
# ============================================================================
#
# This file is mounted read-only into the nginx container at
#   /etc/nginx/nginx.conf
#
# Responsibilities:
#   • Terminate HTTP on port 80 (TLS termination can be added in a second
#     server block or via a separate include for production).
#   • Proxy all regular HTTP traffic to the FastAPI backend on port 8000.
#   • Proxy WebSocket connections at /ws/ with correct Upgrade headers and
#     an extended read timeout so long-lived connections are not dropped.
#   • Enable gzip compression for text-based responses.
#   • Accept file uploads up to 55 MB (≥ the 50 MB backend limit) so Nginx
#     does not reject uploads before they reach the application.
# ============================================================================

# Run as a foreground process (required inside Docker)
daemon off;

# Number of worker processes — "auto" maps to available CPU cores.
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access log
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # ── Upstream — FastAPI backend ─────────────────────────────────────────
    # Service name "api" matches the docker-compose service name so Docker's
    # embedded DNS resolves it correctly on the ai_assistant_net network.
    upstream api {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP server ────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Maximum request body size — must be ≥ MAX_FILE_SIZE_MB in backend
        client_max_body_size 55m;

        # ── Standard HTTP proxy ──────────────────────────────────────────
        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;

            # Standard proxy headers so the backend sees the real client IP
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Disable buffering for streaming / SSE responses
            proxy_buffering    off;
            proxy_read_timeout 120s;
        }

        # ── WebSocket proxy ──────────────────────────────────────────────
        # WebSocket connections are long-lived; raise the timeout to 24 h so
        # the proxy does not drop idle connections between AI response chunks.
        location /ws/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;

            # Required headers for the WebSocket handshake
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;  # 24 h — keep streaming connections alive
        }
    }
}
