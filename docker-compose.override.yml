# ============================================================================
# Android AI Assistant — Docker Compose override (local development)
# ============================================================================
#
# This file is automatically merged with docker-compose.yml by Docker Compose
# when you run `docker compose up` locally.  It:
#
#   • Mounts the backend source tree for hot-reload (no rebuild needed).
#   • Starts uvicorn with --reload so code changes take effect immediately.
#   • Exposes debug / admin ports that are intentionally hidden in production.
#   • Enables remote debugging via debugpy on port 5678.
#
# Do NOT commit real secrets here — keep them in backend/.env (git-ignored).
# ============================================================================

version: "3.8"

services:

  # ── Hot-reload: mount source and switch to uvicorn --reload ───────────────
  api:
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Expose the API directly on the host for local curl / testing without Nginx
    ports:
      - "8000:8000"

  # ── Database — expose port for IDE/GUI tooling ────────────────────────────
  postgres:
    ports:
      - "5432:5432"

  # ── Cache — expose port for redis-cli / RedisInsight ─────────────────────
  redis:
    ports:
      - "6379:6379"

  # ── Celery worker — mount source so task code hot-reloads ─────────────────
  celery-worker:
    volumes:
      - ./backend/app:/app/app
    command: celery -A app.workers.celery_app worker --loglevel=debug --concurrency=2 --pool=solo

  # ── ChromaDB — already exposed via ports in docker-compose.yml ────────────
  # (port 8001 maps to container 8000, no override needed)

  # ── MinIO — already exposed via ports in docker-compose.yml ───────────────
  # (ports 9000 and 9001, no override needed)

  # ── Prometheus — already exposed via ports in docker-compose.yml ──────────
  # (port 9090, no override needed)

  # ── Grafana — already exposed via ports in docker-compose.yml ─────────────
  # (port 3000, no override needed)

  # ── Loki — already exposed via ports in docker-compose.yml ────────────────
  # (port 3100, no override needed)
